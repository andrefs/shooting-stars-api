machine:
  node:
    version: 8.6.0
database:
  # Circle will execute the below commands
  pre:
    # Stop MongoDB
    - sudo mongod --shutdown
    # Download MongoDB 3.2.3
    - curl -Ol https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu1404-3.4.9.tgz
    # Untar it
    - tar -zxvf mongodb-linux-x86_64-ubuntu1404-3.4.9.tgz
    # Create data directory
    - mkdir -p ./data/db
    # Fork MongoDB and log to './mongod.log'. Print the log file if it failed.
    - ./mongodb-linux-x86_64-ubuntu1404-3.4.9/bin/mongod --dbpath ./data/db --logpath ./mongod.log --fork || cat ./mongod.log
test:
  override:
    - npm run test
dependencies:
  pre:
    - sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 20
    - sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-4.8 20
